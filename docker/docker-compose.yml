services:
  webserver:
    build:
      context: ./bin/${PHPVERSION}
    container_name: "${COMPOSE_PROJECT_NAME}-${PHPVERSION}"
    restart: "always"
    ports:
      - "${HOST_MACHINE_UNSECURE_HOST_PORT}:80"
      - "${HOST_MACHINE_SECURE_HOST_PORT}:443"
    links:
      - database
    volumes:
      - ${DOCUMENT_ROOT-./www}:/var/www/html:rw
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${SSL_DIR-./config/ssl}:/etc/apache2/ssl/
      - ${VHOSTS_DIR-./config/vhosts}:/etc/apache2/sites-enabled
      - ${LOG_DIR-./logs/apache2}:/var/log/apache2
      - ${XDEBUG_LOG_DIR-./logs/xdebug}:/var/log/xdebug
      # Development CA (mkcert) so PHP trusts https://office.localhost:8443, see the Collabora documentation
      - ./config/caddy/certs/rootCA.pem:/usr/local/share/ca-certificates/mkcert-dev.crt:ro
    environment:
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html}
      PMA_PORT: ${HOST_MACHINE_PMA_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      HOST_MACHINE_MYSQL_PORT: ${HOST_MACHINE_MYSQL_PORT}
      XDEBUG_CONFIG: "client_host=host.docker.internal remote_port=${XDEBUG_PORT}"
      XDEBUG_MODE: develop,debug
      PHP_MEMORY_LIMIT: 1024M
      PHP_UPLOAD_LIMIT: 1024M
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "office.localhost:host-gateway"
  database:
    build:
      context: "./bin/${DATABASE}"
    container_name: "${COMPOSE_PROJECT_NAME}-${DATABASE}"
    restart: "always"
    ports:
      - "127.0.0.1:${HOST_MACHINE_MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_INITDB_DIR-./config/initdb}:/docker-entrypoint-initdb.d
      - ${MYSQL_DATA_DIR-./data/mysql}:/var/lib/mysql
      - ${MYSQL_LOG_DIR-./logs/mysql}:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  phpmyadmin:
    image: phpmyadmin
    container_name: "${COMPOSE_PROJECT_NAME}-phpmyadmin"
    links:
      - database
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      MEMORY_LIMIT: ${MEMORY_LIMIT}
    ports:
      - "${HOST_MACHINE_PMA_PORT}:80"
      - "${HOST_MACHINE_PMA_SECURE_PORT}:443"
    volumes:
      - /sessions
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/conf.d/php-phpmyadmin.ini
  redis:
    container_name: "${COMPOSE_PROJECT_NAME}-redis"
    image: redis:latest
    ports:
      - "127.0.0.1:${HOST_MACHINE_REDIS_PORT}:6379"
  # Collabora Online (development only). Reached through the caddy proxy at https://office.localhost
  collabora:
    image: collabora/code:latest
    container_name: "${COMPOSE_PROJECT_NAME}-collabora"
    restart: "always"
    cap_add:
      - MKNOD
    environment:
      username: ${COLLABORA_ADMIN_USER}
      password: ${COLLABORA_ADMIN_PASSWORD}
      server_name: ${COLLABORA_SERVER_NAME}
      # TLS is terminated by the caddy proxy, Collabora speaks plain HTTP inside the compose network.
      # ssl.ca_file_path makes Collabora trust the mkcert CA for its outgoing WOPI HTTPS calls (dev only)
      # net.frame_ancestors is obsolete: the CRM page (localhost) must be allowed to embed the editor through the CSP
      extra_params: '--o:ssl.enable=false --o:ssl.termination=true --o:ssl.ca_file_path=/etc/ssl/mkcert/rootCA.pem --o:storage.ssl.ca_file_path=/etc/ssl/mkcert/rootCA.pem --o:storage.wopi.alias_groups.mode=groups --o:net.content_security_policy="frame-ancestors http://localhost:* https://localhost:*"'
      # The CRM API only answers over HTTPS: Collabora calls it on the secure host port
      aliasgroup1: "https://host.docker.internal:${HOST_MACHINE_SECURE_HOST_PORT}"
    volumes:
      - ./config/caddy/certs/rootCA.pem:/etc/ssl/mkcert/rootCA.pem:ro
    expose:
      - "9980"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  caddy:
    image: caddy:latest
    container_name: "${COMPOSE_PROJECT_NAME}-caddy"
    restart: "always"
    depends_on:
      - collabora
    ports:
      - "${COLLABORA_HTTPS_PORT}:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/certs:/etc/caddy/certs:ro

